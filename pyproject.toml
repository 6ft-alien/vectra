[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-dynamics-zero-trust"
version = "1.0.0"
description = "Behavioral Biometrics for Continuous Authentication in Zero-Trust Web Architectures"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nityanand KG", email = "nityanand.kg@res.christuniversity.in" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
